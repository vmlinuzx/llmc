[rlm]
root_model = "openai/ArliAI_GLM-4.5-Air-Derestricted-Q4_K_M-Combined.gguf"
sub_model = "openai/ArliAI_GLM-4.5-Air-Derestricted-Q4_K_M-Combined.gguf"
api_base = "http://athena:8081/v1"

[rlm.llm.root]
temperature = 0.1
max_tokens = 4096
min_p = 0.01
top_k = 40
repetition_penalty = 1.0

[rlm.llm.sub]
temperature = 0.1
max_tokens = 1024
min_p = 0.01
top_k = 40
repetition_penalty = 1.0

[mcp.rest_api]
enabled = true
auth_mode = "auto"

[mcp.workspaces]
default = "llmc"

[mcp.workspaces.repos]
llmc = "/home/vmlinux/src/llmc"
